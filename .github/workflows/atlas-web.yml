name: PANTECHNOSYNI Atlas Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'scripts/build-atlas-web-data.mjs'
      - 'scripts/check-atlas-web.mjs'
      - 'test/atlas-web.test.mjs'
      - 'docs/ARCHITECTURE_ATLAS_WEB.md'
      - '.github/workflows/atlas-web.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/build-atlas-web-data.mjs --check
      - run: node --test test/atlas-web.test.mjs
      - run: node scripts/check-atlas-web.mjs
